name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint a11y (gate)
        # Falla si aparece cualquier problema de accesibilidad (red de seguridad a11y).
        #
        # La versión anterior contaba coincidencias de texto:
        #   A11Y=$(npx eslint ... | grep -c "jsx-a11y" || true); test "$A11Y" -eq 0
        # Como no existía ningún archivo de configuración de ESLint, el comando
        # abortaba con "couldn't find a configuration file" ANTES de evaluar una
        # sola regla, el grep contaba 0 y el gate pasaba en verde. Nunca corrió.
        # Ahora se confía en el exit code de eslint, que no se puede falsear así.
        run: npx eslint src --ext .js,.jsx --max-warnings 0

      - name: Test
        run: npm run test:ci

      - name: Build
        env:
          CI: "false" # los warnings no rompen el build de producción
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_KEY: ${{ secrets.REACT_APP_SUPABASE_KEY }}
        run: npm run build
